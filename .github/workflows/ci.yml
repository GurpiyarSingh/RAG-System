# CI: lint → tests → images → full-stack smoke + e2e (IMPLEMENTATION_PLAN.md P0.9 / P1.24).
# The e2e job runs the whole Compose stack with the fake OpenAI server and the bundled
# PostgreSQL 18.6 container, so CI needs no OpenAI key and no external database.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.6"
  PYTHON_VERSION: "3.14"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - uses: astral-sh/setup-uv@v6
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true }
      - run: uv sync --frozen
      - run: uv run ruff check src tests migrations scripts
      - run: uv run ruff format --check src tests migrations scripts
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - uses: astral-sh/setup-uv@v6
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true }
      - run: uv sync --frozen
      # Integration tests start postgres:18.6 and Qdrant via Testcontainers (Docker is
      # preinstalled on ubuntu-latest).
      - run: uv run pytest --cov=rag_service --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build rag-service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          tags: rag-service:local
          load: true
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - name: Build rag-parser image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.parser
          tags: rag-parser:local
          load: true
          cache-from: type=gha,scope=parser
          cache-to: type=gha,mode=max,scope=parser
      - name: Save images for the e2e job
        run: docker save rag-service:local rag-parser:local | gzip > images.tar.gz
      - uses: actions/upload-artifact@v4
        with: { name: images, path: images.tar.gz, retention-days: 1 }

  e2e:
    needs: [docker]
    runs-on: ubuntu-latest
    env:
      # Use the bundled PostgreSQL container instead of a host database.
      RAG_DOCKER_DB_HOST: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - uses: astral-sh/setup-uv@v6
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true }
      - uses: actions/download-artifact@v4
        with: { name: images }
      - run: gunzip -c images.tar.gz | docker load
      - name: Create .env with throwaway secrets
        run: python scripts/gen_env.py
      - name: Start the stack
        run: >
          docker compose -f compose.yaml -f compose.e2e.yaml --profile bundled-postgres
          up -d --wait --wait-timeout 300
      - run: uv sync --frozen
      - run: uv run pytest -m e2e tests/e2e -v
      - name: Container logs on failure
        if: failure()
        run: docker compose -f compose.yaml -f compose.e2e.yaml --profile bundled-postgres logs --tail=300
