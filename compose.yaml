# =============================================================================
# RAG service — local V1 stack (prod-like base).
#
#   docker compose up -d --wait              dev mode (auto-loads compose.override.yaml)
#   docker compose -f compose.yaml up -d     prod-like mode, exactly what ships later
#
# PostgreSQL is NOT a container here: the stack uses the PostgreSQL 18 already installed
# on the host (IMPLEMENTATION_PLAN.md §3.5), reached via host.docker.internal.
# CI and machines without a local Postgres add `--profile bundled-postgres`.
#
# Infrastructure ports bind to 127.0.0.1 only: reachable from this machine for
# debugging and host-side tests, never from the LAN.
# =============================================================================
name: rag

x-app-env: &app-env
  # Hostnames inside the Compose network. They override the localhost defaults in .env,
  # which are meant for tools running directly on the host.
  RAG_DB_HOST: ${RAG_DOCKER_DB_HOST:-host.docker.internal}
  RAG_REDIS_URL: redis://redis:6379/0
  RAG_QDRANT_URL: http://qdrant:6333
  RAG_S3_ENDPOINT_URL: http://seaweedfs:8333
  RAG_TEMPORAL_ADDRESS: temporal:7233

x-app: &app
  image: rag-service:local
  build:
    context: .
    dockerfile: deploy/docker/Dockerfile
  env_file: .env
  environment: *app-env
  # Lets containers reach the host's PostgreSQL. Docker Desktop provides the name
  # already; the explicit mapping also makes it work on Linux (CI).
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: unless-stopped
  networks: [rag-net]
  depends_on:
    bootstrap:
      condition: service_completed_successfully

services:
  # --------------------------------------------------------------------- infrastructure
  redis:
    image: redis:7.4.11
    # Cache + rate-limit buckets only (never a source of truth), so persistence is off.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [rag-net]

  qdrant:
    image: qdrant/qdrant:v1.19.2
    ports: ["127.0.0.1:6333:6333", "127.0.0.1:6334:6334"]  # HTTP (+ /dashboard), gRPC
    volumes: ["qdrant_data:/qdrant/storage"]
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    healthcheck:
      # The image ships without curl/wget; bash's /dev/tcp is enough to probe the port.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200' <&3"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    networks: [rag-net]

  seaweedfs:
    # S3-compatible object storage. MinIO no longer publishes community images, so
    # SeaweedFS (Apache-2.0) fills the role locally; the app only speaks the S3 API.
    image: chrislusf/seaweedfs:4.48
    entrypoint: ["/bin/sh", "/opt/rag/start-seaweedfs.sh"]
    env_file: .env
    ports: ["127.0.0.1:8333:8333"]
    volumes:
      - "seaweedfs_data:/data"
      - "./deploy/compose/seaweedfs:/opt/rag:ro"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    networks: [rag-net]

  temporal:
    # Temporal dev server: workflow engine + Web UI (http://localhost:8233), SQLite file
    # on a volume so workflow history survives restarts.
    image: temporalio/temporal:1.8.3
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db", "--ui-port", "8233"]
    ports: ["127.0.0.1:7233:7233", "127.0.0.1:8233:8233"]
    volumes: ["temporal_data:/data"]
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    networks: [rag-net]

  # Only for CI / machines without a local PostgreSQL. Same version as the host install.
  postgres:
    profiles: ["bundled-postgres"]
    image: postgres:18.6
    environment:
      POSTGRES_PASSWORD: ${RAG_POSTGRES_SUPERUSER_PASSWORD:-postgres}
      RAG_DB_OWNER_PASSWORD: ${RAG_DB_OWNER_PASSWORD}
      RAG_DB_APP_PASSWORD: ${RAG_DB_APP_PASSWORD}
    volumes:
      - "./deploy/compose/postgres/init:/docker-entrypoint-initdb.d:ro"
      - "./scripts/db/init_local.sql:/opt/rag/init_local.sql:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [rag-net]

  # --------------------------------------------------------------------- one-shot job
  bootstrap:
    <<: *app
    command: ["bootstrap"]
    restart: "no"
    depends_on:
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      seaweedfs: { condition: service_healthy }
      # Ignored unless the bundled-postgres profile is active.
      postgres: { condition: service_healthy, required: false }

  # --------------------------------------------------------------------- application
  rag-api:
    <<: *app
    command: ["api", "--port", "8000"]
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512m }

  rag-query:
    <<: *app
    command: ["query", "--port", "8001"]
    ports: ["127.0.0.1:8001:8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/readyz', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512m }

  index-worker:
    <<: *app
    command: ["worker", "index"]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512m }

  parse-worker:
    <<: *app
    image: rag-parser:local
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.parser
    command: ["worker", "parse"]
    # Docling's models need memory. The limit keeps one huge PDF from OOM-killing the
    # whole WSL VM. Raise it if Docker has more than the default ~4 GB.
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2560m }

volumes:
  qdrant_data:
  seaweedfs_data:
  temporal_data:

networks:
  rag-net:
